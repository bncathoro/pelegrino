<!-- CENTRAL MASTER: EXCLUSÕES E RESETS -->
<div class="bg-white p-6 rounded-lg shadow-md space-y-6">
  <h2 class="text-xl font-bold text-gray-800 border-b pb-2">Central Master: Gerenciamento e Exclusões</h2>

  <!-- 1. EXCLUSÃO INDIVIDUAL -->
  <div class="space-y-4">
    <h3 class="text-md font-semibold text-gray-700">Ajustes e Exclusões Pontuais</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- Apagar Caixa -->
      <div class="p-4 border rounded bg-gray-50 flex flex-col justify-between">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Excluir Caixa / Lote de Teste</label>
          <input type="text" id="inputExcluirCaixa" placeholder="Digite o ID/Número da caixa" class="w-full p-2 border rounded text-sm mb-2">
        </div>
        <button onclick="excluirCaixaIndividual()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded text-sm">
          Excluir Caixa e Peças
        </button>
      </div>

      <!-- Apagar Peça Específica -->
      <div class="p-4 border rounded bg-gray-50 flex flex-col justify-between">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Excluir Peça Individual (Etiqueta)</label>
          <input type="text" id="inputExcluirPeca" placeholder="Ex: Ancho-P1 ou ID da peça" class="w-full p-2 border rounded text-sm mb-2">
        </div>
        <button onclick="excluirPecaIndividual()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded text-sm">
          Excluir Peça
        </button>
      </div>

    </div>
  </div>

  <hr class="my-4">

  <!-- 2. AÇÕES DE SISTEMA -->
  <div class="space-y-4">
    <h3 class="text-md font-semibold text-gray-700">Ações Globais do Sistema</h3>
    <div class="flex flex-col sm:flex-row gap-4">
      
      <!-- Virada de Mês -->
      <button onclick="executarViradaDeMes()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded text-sm shadow">
        🔄 Executar Virada de Mês (Zerar P1)
      </button>

      <!-- Reset Geral -->
      <button onclick="executarResetGeral()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded text-sm shadow">
        ⚠️ Reiniciar Tudo (Reset de Fábrica)
      </button>

    </div>
  </div>
</div>

<script>
// Função para excluir uma caixa inteira e suas peças
function excluirCaixaIndividual() {
  const idCaixa = document.getElementById('inputExcluirCaixa').value.trim();
  if (!idCaixa) return alert('Por favor, informe o código/ID da caixa.');

  if (confirm(`Tem certeza que deseja excluir a caixa ${idCaixa} e todas as suas peças?`)) {
    let caixas = JSON.parse(localStorage.getItem('caixas')) || [];
    let pecas = JSON.parse(localStorage.getItem('pecas')) || [];

    // Filtra removendo a caixa e as peças vinculadas a ela
    caixas = caixas.filter(c => c.id !== idCaixa && c.numero !== idCaixa);
    pecas = pecas.filter(p => p.idCaixa !== idCaixa && p.caixa !== idCaixa);

    localStorage.setItem('caixas', JSON.stringify(caixas));
    localStorage.setItem('pecas', JSON.stringify(pecas));

    alert(`Caixa ${idCaixa} excluída com sucesso!`);
    document.getElementById('inputExcluirCaixa').value = '';
    location.reload(); // Recarrega para atualizar a tela
  }
}

// Função para excluir apenas uma peça
function excluirPecaIndividual() {
  const idPeca = document.getElementById('inputExcluirPeca').value.trim();
  if (!idPeca) return alert('Por favor, informe a etiqueta ou ID da peça.');

  if (confirm(`Tem certeza que deseja excluir a peça ${idPeca}?`)) {
    let pecas = JSON.parse(localStorage.getItem('pecas')) || [];
    
    const pecasIniciais = pecas.length;
    pecas = pecas.filter(p => p.etiqueta !== idPeca && p.id !== idPeca);

    if (pecas.length === pecasIniciais) {
      return alert('Peça não encontrada. Verifique a etiqueta informada.');
    }

    localStorage.setItem('pecas', JSON.stringify(pecas));

    alert(`Peça ${idPeca} removida do estoque com sucesso!`);
    document.getElementById('inputExcluirPeca').value = '';
    location.reload();
  }
}

// Reset Geral com confirmação de segurança
function executarResetGeral() {
  const confirmacao = prompt('ATENÇÃO: Esta ação apaga TODOS os dados do aplicativo (caixas, peças, estoques e históricos).\n\nDigite "ZERAR" para confirmar:');
  
  if (confirmacao === 'ZERAR') {
    localStorage.clear();
    alert('O aplicativo foi reiniciado com sucesso! Todos os dados foram limpos.');
    location.reload();
  } else if (confirmacao !== null) {
    alert('Confirmação incorreta. O aplicativo NÃO foi reiniciado.');
  }
}
</script>
